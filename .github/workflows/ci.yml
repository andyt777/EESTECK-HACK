# FileGrid PPC - continuous integration.
# Every third-party action is pinned to the commit SHA of an exact release tag (tag in the comment).
# Jobs: backend (Maven + Testcontainers), frontend (Angular build), python (intelligence + simulator:
# ruff + pytest), gitleaks (full history), images (docker build + Trivy, report-only).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, unit + Testcontainers IT)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      # mvnw is committed without the executable bit (Windows checkout), so call it through sh.
      # Integration tests start PostgreSQL, RabbitMQ, S3 and FTP with Testcontainers (Docker is on the runner).
      - name: mvnw verify
        run: sh ./mvnw -B -ntp verify
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend (Angular build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # `npm ci` rejects the lock file generated on Windows (cross-platform optional wasm deps);
      # the Dockerfile uses `npm install` for the same reason, so CI does the same.
      - name: npm install
        run: npm install --no-audit --no-fund
      - name: ng build (production)
        run: npx ng build --configuration production

  python:
    name: Python ${{ matrix.service }} (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service: [intelligence, simulator]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # Same uv as the Dockerfiles (ghcr.io/astral-sh/uv:0.7.3-python3.12-bookworm-slim).
          version: "0.7.3"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: ${{ matrix.service }}/uv.lock
      - name: uv sync
        run: uv sync --frozen
      - name: ruff
        run: uv run ruff check src tests
      - name: pytest
        run: uv run pytest -q

  gitleaks:
    name: Secret scan (gitleaks, full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Official image, same version as .pre-commit-config.yaml; reads .gitleaks.toml from the repo root.
      - name: gitleaks git
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner --verbose

  images:
    name: Image ${{ matrix.image }} (build + Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [gitleaks]
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend, intelligence, simulator]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.image }}
          push: false
          load: true
          tags: filegrid/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Report-only: findings are printed and uploaded, they never fail the build (exit-code 0).
      - name: Trivy image scan (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: filegrid/${{ matrix.image }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-${{ matrix.image }}.txt
      - name: Show Trivy report
        if: always()
        run: cat trivy-${{ matrix.image }}.txt || true
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-${{ matrix.image }}
          path: trivy-${{ matrix.image }}.txt
          if-no-files-found: ignore
          retention-days: 14

  dependencies:
    name: Dependency + config scan (Trivy fs, report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy filesystem scan (report-only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table
          output: trivy-fs.txt
      - name: Show Trivy report
        if: always()
        run: cat trivy-fs.txt || true
      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-fs
          path: trivy-fs.txt
          if-no-files-found: ignore
          retention-days: 14
