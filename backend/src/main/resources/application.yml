# FileGrid backend. One application, two roles selected by profile:
#   api    - HTTP API (default)
#   worker - consumes the queues of the categories listed in WORKER_CATEGORIES
# Every credential comes from the environment; nothing secret lives in this file.
spring:
  application:
    name: filegrid
  profiles:
    default: api

  # Several @Scheduled jobs (storage health probe, recovery, reconciliation, incidents, metrics) share this
  # pool. With the default single thread, one slow job delays the 10 s health probe past
  # filegrid.routing.health-max-age and Agent 01 then sees every storage as UNKNOWN (file goes PENDING).
  task:
    scheduling:
      pool:
        size: 4

  # meta-db: metadata, routing decisions, audit
  datasource:
    url: ${META_DB_URL:jdbc:postgresql://localhost:5432/filegrid_meta}
    username: ${META_DB_USER:filegrid_meta}
    password: ${META_DB_PASSWORD:}
    hikari:
      pool-name: meta-db
      maximum-pool-size: ${META_DB_POOL_SIZE:10}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration/meta

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    # A job counts as queued only once the broker confirms it (JobPublisher waits for the
    # confirm); an unroutable message is returned instead of being silently dropped.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mvc:
    async:
      # Downloads are streamed (StreamingResponseBody): a large video may take long.
      request-timeout: 1h

  servlet:
    multipart:
      enabled: true
      max-file-size: 5GB
      max-request-size: 5GB
      file-size-threshold: 2MB

server:
  port: 8080
  shutdown: graceful
  servlet:
    context-path: /api

# Actuator lives on its own port, which the gateway never routes to (except
# the single health path). Metrics are therefore reachable only from inside
# the internal network (Prometheus).
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: filegrid

# OpenAPI / Swagger UI are enabled only by the `dev` profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

filegrid:
  # Stage 11: JWT from Keycloak (realm filegrid). Browser tokens carry the public issuer,
  # service tokens fetched inside the Docker network the internal one.
  security:
    issuers:
      - ${FILEGRID_OIDC_ISSUER:https://localhost/auth/realms/filegrid}
      - ${FILEGRID_OIDC_INTERNAL_ISSUER:http://keycloak:8080/auth/realms/filegrid}
    jwk-set-uri: ${FILEGRID_OIDC_JWK_SET_URI:http://keycloak:8080/auth/realms/filegrid/protocol/openid-connect/certs}
    audience: filegrid-api
    # HMAC key for signed download/preview links (base64, 256 bit).
    link-key: ${FILEGRID_LINK_KEY:}
  crypto:
    # Key-encryption key (256 bit, base64). Wraps the per-file data keys of personal data.
    kek: ${FILEGRID_KEK:}
    kek-id: ${FILEGRID_KEK_ID:kek-1}
    # Rotation: older KEKs still needed to open old files, "id:base64,id:base64".
    previous-keks: ${FILEGRID_KEK_PREVIOUS:}
  notify:
    mode: ${NOTIFY_MODE:SIMULATED}
    routing-file: ${NOTIFY_ROUTING_FILE:../config/notification-routing.yaml}
    templates-dir: ${NOTIFY_TEMPLATES_DIR:../config/templates}
    # For example 2m: one escalation delay for every severity (demo).
    escalation-override: ${NOTIFY_ESCALATION_OVERRIDE:}
  # PPCastor on real WhatsApp (docs/ADR/0008-whatsapp-inbound.md); active only with NOTIFY_MODE=REAL + TWILIO_*.
  whatsapp:
    webhook-url: ${WHATSAPP_WEBHOOK_URL:}
    token-url: ${KC_TOKEN_URL:http://keycloak:8080/auth/realms/filegrid/protocol/openid-connect/token}
    client-id: ${KC_WHATSAPP_CLIENT_ID:filegrid-whatsapp}
    client-secret: ${KC_WHATSAPP_SECRET:}
    intelligence-url: ${INTELLIGENCE_URL:http://intelligence:8000/api/intelligence}
  # store-db: the "Database" storage, a separate PostgreSQL instance
  store-db:
    url: ${STORE_DB_URL:jdbc:postgresql://localhost:5433/filegrid_store}
    username: ${STORE_DB_USER:filegrid_store}
    password: ${STORE_DB_PASSWORD:}
    pool-size: ${STORE_DB_POOL_SIZE:5}

  storage:
    health-interval: 10s
    s3:
      endpoint: ${S3_ENDPOINT:http://localhost:9000}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      bucket-prefix: ${S3_BUCKET_PREFIX:filegrid-}
      health-bucket: ${S3_HEALTH_BUCKET:filegrid-benchmark}
      part-size-bytes: 16777216        # 16 MB: multipart part size and the largest buffer
    ftp:
      host: ${FTP_HOST:localhost}
      port: ${FTP_PORT:21}
      username: ${FTP_USER:filegrid}
      password: ${FTP_PASSWORD:}
      pool-size: ${FTP_POOL_SIZE:8}
      connect-timeout: 10s
      data-timeout: 60s
      max-resume-attempts: 3
    database:
      max-object-bytes: ${DATABASE_STORAGE_MAX_BYTES:67108864}   # 64 MB
      read-chunk-bytes: 4194304                                  # 4 MB

  # Agent 01: routing policy. The file is mounted, never packaged in the jar.
  policy:
    file: ${FILEGRID_POLICY_FILE:../config/policies.yaml}
    # How often the file checksum (and the latest stored version) is re-checked.
    check-interval: ${FILEGRID_POLICY_CHECK_INTERVAL:10s}
  routing:
    # A health probe older than this is not trusted (the storage counts as unavailable).
    health-max-age: ${FILEGRID_ROUTING_HEALTH_MAX_AGE:30s}

  worker:
    categories: ${WORKER_CATEGORIES:}
    # Transfers handled at the same time by one worker instance (per category queue).
    concurrency: ${WORKER_CONCURRENCY:4}
    # Unacknowledged jobs per consumer (1: a long video never holds other jobs back).
    prefetch: ${WORKER_PREFETCH:1}

  ingestion:
    # How often PENDING files (storage back UP) and interrupted ingestions are resumed.
    recovery-interval: ${FILEGRID_INGESTION_RECOVERY_INTERVAL:30s}
    stale-after: 2m

  staging:
    directory: ${FILEGRID_STAGING_DIR:/data/staging}
    max-size-bytes: 5368709120
    cleanup-older-than: 24h
    cleanup-interval: 1h

  retrieval:
    # Up to this size a file is verified completely before the first byte is served.
    verify-before-serve-max-bytes: ${FILEGRID_VERIFY_BEFORE_SERVE_MAX_BYTES:209715200}   # 200 MB
  integrity:
    scrub-interval: ${FILEGRID_SCRUB_INTERVAL:15m}
    scrub-sample-size: ${FILEGRID_SCRUB_SAMPLE_SIZE:10}
    scrub-max-age: ${FILEGRID_SCRUB_MAX_AGE:7d}

  upload:
    max-size-bytes: ${FILEGRID_UPLOAD_MAX_BYTES:5368709120}   # 5 GB
