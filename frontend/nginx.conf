# Static SPA behind the Traefik gateway (TLS terminates there). /api and /grafana
# are routed by Traefik with higher priority and never reach this server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

    # Hashed bundles: cache for a long time.
    location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: every client route serves index.html (never cached).
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }
}
