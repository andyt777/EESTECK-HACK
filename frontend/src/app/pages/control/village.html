<div class="village" [class.dragging]="dragging()" [class.over]="overAgent()" (dragover)="onDragOver($event)" (dragleave)="onDragLeave($event)" (drop)="onDrop($event)">
  <svg viewBox="0 0 1200 680" preserveAspectRatio="xMidYMid meet" class="scene" role="img" [attr.aria-label]="t.control.title">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#bfe2ff"/><stop offset=".3" stop-color="#e3f3ff"/><stop offset=".55" stop-color="#ffffff"/>
      </linearGradient>
      <!-- one tree, reused: trunk at the origin, canopy above -->
      <g id="tree">
        <ellipse cy="2" rx="17" ry="4.5" class="tshadow"/>
        <rect x="-3" y="-20" width="6" height="22" rx="2" class="trunk"/>
        <circle cy="-38" r="23" class="leaf"/>
        <circle cx="-7" cy="-45" r="11" class="leaf-hi"/>
      </g>
      <g id="bush"><ellipse cy="-7" rx="17" ry="11" class="leaf"/><ellipse cx="-5" cy="-10" rx="8" ry="5" class="leaf-hi"/></g>
      <!-- wind turbine: mast from the origin up to the hub at (0,-78) -->
      <g id="turbine">
        <path d="M-3.5 0 L-1.6 -78 H1.6 L3.5 0 Z" class="mast"/>
        <g class="blades">
          <path d="M0 -78 L-4 -98 Q0 -122 4 -98 Z" class="blade"/>
          <path d="M0 -78 L-4 -98 Q0 -122 4 -98 Z" class="blade" transform="rotate(120 0 -78)"/>
          <path d="M0 -78 L-4 -98 Q0 -122 4 -98 Z" class="blade" transform="rotate(240 0 -78)"/>
        </g>
        <circle cy="-78" r="4" class="hub"/>
      </g>
    </defs>

    <!-- daylight sky, far hills with wind turbines, white ground -->
    <rect x="-1500" width="4200" height="680" fill="url(#sky)"/>
    <g class="clouds">
      <path d="M250 62 a16 16 0 0 1 30 -8 a20 20 0 0 1 38 4 a13 13 0 0 1 4 26 h-66 a12 12 0 0 1 -6 -22 Z"/>
      <path d="M812 86 a12 12 0 0 1 23 -6 a15 15 0 0 1 29 3 a10 10 0 0 1 3 20 h-51 a9 9 0 0 1 -4 -17 Z"/>
    </g>
    <path d="M-1500 150 H0 Q150 92 330 128 T700 118 T1010 108 T1200 136 H2700 V250 H-1500 Z" class="hill far"/>
    <use href="#turbine" x="172" y="126" class="t1"/>
    <use href="#turbine" x="268" y="122" class="t2" transform="translate(268 122) scale(.78) translate(-268 -122)"/>
    <use href="#turbine" x="958" y="114" class="t3" transform="translate(958 114) scale(.88) translate(-958 -114)"/>
    <path d="M-1500 196 H0 Q240 150 520 182 T1010 170 T1200 190 H2700 V330 H-1500 Z" class="hill near"/>
    <rect x="-1500" y="250" width="4200" height="430" class="ground"/>
    <path d="M-1500 250 H0 Q260 226 560 246 T1200 240 H2700 V300 H-1500 Z" class="ground"/>

    <!-- creek: PPCastor's lodge sits on it -->
    <path d="M74 150 C30 240 118 310 66 404 S96 590 44 680" class="creek"/>
    <path d="M74 150 C30 240 118 310 66 404 S96 590 44 680" class="ripple"/>

    <text x="650" y="34" class="zone-label" text-anchor="middle">{{ t.control.housesTitle }}</text>
    <text x="1060" y="34" class="zone-label" text-anchor="middle">{{ t.control.serversTitle }}</text>

    <!-- footpaths: lodge -> plaza -> every door -->
    <g class="paths">
      <path [attr.d]="'M' + (entry.x + 40) + ' ' + (entry.y + 8) + ' L' + (home.x - 40) + ' ' + (home.y + 8)" />
      @for (c of cats; track c) {
        <path [attr.d]="'M' + (home.x + 30) + ' ' + (home.y + 8) + ' C' + (home.x + 120) + ' ' + (home.y + 8) + ' ' + (H[c].x - 190) + ' ' + (H[c].y + 8) + ' ' + (H[c].x - 70) + ' ' + (H[c].y + 8)"
          [class.hot]="hotHouse() === c" />
      }
    </g>

    <!-- trees and bushes (behind the energy lines) -->
    <g class="green">
      <use href="#tree" x="206" y="262"/><use href="#tree" x="242" y="284" transform="translate(242 284) scale(.72) translate(-242 -284)"/>
      <use href="#tree" x="392" y="232" transform="translate(392 232) scale(.86) translate(-392 -232)"/>
      <use href="#tree" x="176" y="566"/><use href="#tree" x="388" y="606" transform="translate(388 606) scale(.8) translate(-388 -606)"/>
      <use href="#tree" x="224" y="636" transform="translate(224 636) scale(.7) translate(-224 -636)"/>
      <use href="#tree" x="846" y="300" transform="translate(846 300) scale(.84) translate(-846 -300)"/>
      <use href="#tree" x="902" y="492"/><use href="#tree" x="838" y="628" transform="translate(838 628) scale(.76) translate(-838 -628)"/>
      <use href="#tree" x="1168" y="292" transform="translate(1168 292) scale(.8) translate(-1168 -292)"/>
      <use href="#tree" x="1164" y="476" transform="translate(1164 476) scale(.7) translate(-1164 -476)"/>
      <use href="#bush" x="150" y="330"/><use href="#bush" x="470" y="418"/><use href="#bush" x="880" y="392"/><use href="#bush" x="300" y="520"/>
    </g>

    <!-- meter readings: a permanent, aggregated line (the simulator streams continuously) -->
    @if (meterFlowing()) {
      <path [attr.d]="meterWire()" class="wire meter" />
      <g class="meter-pill" [attr.transform]="'translate(' + meterLabelAt().x + ' ' + meterLabelAt().y + ')'">
        <rect x="-58" y="-12" width="116" height="22" rx="11"/>
        <text y="3" text-anchor="middle">{{ meterLabel() }}</text>
      </g>
    }

    <!-- the energy line PPCastor connects for the file he carried -->
    @if (wireD(); as d) {
      <path id="wire-hot" [attr.d]="d" class="wire hot" [class.broken]="status(wire()!.st) === 'DOWN'" />
    }

    <!-- entry: the lodge on the creek -->
    <g class="entry" [attr.transform]="'translate(' + entry.x + ' ' + entry.y + ')'">
      <ellipse rx="52" ry="11" cy="10" class="pad"/>
      <path d="M-42 10 Q-42 -44 0 -48 Q42 -44 42 10 Z" class="lodge"/>
      <path d="M-36 -8 H36 M-40 2 H40 M-28 -20 H28 M-17 -32 H17" class="logline"/>
      <path d="M-13 10 V-8 Q0 -22 13 -8 V10 Z" class="lodge-door"/>
      <circle cx="-30" cy="-3" r="3.2" class="logend"/><circle cx="31" cy="-14" r="3.2" class="logend"/><circle cx="-20" cy="-26" r="3.2" class="logend"/>
      <text y="34" text-anchor="middle" class="lbl">{{ t.control.entry }}</text>
      @if (entryFile()) {
        <g class="incoming"><path d="M-9 -78 h12 l6 6 v20 h-18 z" class="doc"/><path d="M3 -78 v6 h6" class="fold"/></g>
      }
    </g>

    <!-- plaza where PPCastor waits for files -->
    <ellipse [attr.cx]="home.x" [attr.cy]="home.y + 6" rx="86" ry="22" class="plaza"/>

    <!-- category buildings: click opens the category -->
    @for (c of cats; track c) {
      <g class="house" [class.hot]="hotHouse() === c" [attr.transform]="'translate(' + H[c].x + ' ' + H[c].y + ')'"
         (click)="openHouse(c)" (keydown)="houseKey($event, c)" tabindex="0" role="link" [attr.aria-label]="t.categoryHouse[c] + ' — ' + t.category[c]">
        <title>{{ t.categoryHouse[c] }}</title>
        <ellipse cy="3" rx="72" ry="9" class="ground-shadow"/>
        <rect x="-48" y="-58" width="96" height="58" rx="3" class="wall"/>
        <polygon points="-60,-55 0,-102 60,-55" class="roof"/>
        <!-- solar panel on the roof -->
        <polygon points="18,-80 40,-63 40,-58 18,-75" class="solar"/>
        <path d="M25.3 -74.4 V-69.4 M32.7 -68.7 V-63.7" class="solar-line"/>
        <circle cy="-72" r="13" class="emblem"/>
        <text y="-65" text-anchor="middle" class="ms icon">{{ H[c].icon }}</text>
        <rect x="-38" y="-46" width="18" height="15" rx="2" class="win"/>
        <rect x="20" y="-46" width="18" height="15" rx="2" class="win"/>
        <path d="M-11 0 V-24 Q0 -34 11 -24 V0 Z" class="door"/>
        <rect x="48" y="-28" width="14" height="12" rx="3" class="socket"/>
        <text y="24" text-anchor="middle" class="hlabel">{{ t.category[c] }}</text>
        <text y="40" text-anchor="middle" class="hsub">{{ houseCount(c) }}@if (inProgress(c) > 0) {<tspan class="act"> · {{ inProgress(c) }} {{ t.control.inProgress }}</tspan>}</text>
        @if (warnings(c) > 0) {
          <g transform="translate(54 -86)"><circle r="11" class="warn-dot"/><text y="4" text-anchor="middle" class="warn-txt">{{ warnings(c) }}</text>
            <title>{{ warnings(c) }} {{ t.control.warnings }}</title></g>
        }
      </g>
    }

    <!-- storage buildings -->
    @for (s of storages; track s) {
      <g class="server" [class.hot]="wire()?.st === s" [class.down]="status(s) === 'DOWN'" [class.pulse-in]="pulseServer() === s"
         [attr.transform]="'translate(' + S[s].x + ' ' + S[s].y + ')'">
        <title>{{ t.storage[s] }} — {{ t.storage[status(s)] }}</title>
        <ellipse cy="63" rx="60" ry="9" class="ground-shadow"/>
        <rect x="-44" y="-60" width="88" height="122" rx="12" class="rack"/>
        @for (i of [0, 1, 2, 3]; track i) {
          <rect x="-32" [attr.y]="-34 + i * 22" width="64" height="14" rx="4" class="slot"/>
          <circle cx="20" [attr.cy]="-27 + i * 22" r="3" class="led" [style.animation-delay]="i * 0.35 + 's'"/>
        }
        <text y="-42" text-anchor="middle" class="ms sicon">{{ S[s].icon }}</text>
        <text y="86" text-anchor="middle" class="slabel">{{ t.storage[s] }}</text>
        <text y="104" text-anchor="middle" class="sstatus s-{{ status(s) }}">{{ t.storage[status(s)] }} {{ latency(s) }}</text>
      </g>
    }

    <!-- data packet travelling on the energy line -->
    <g id="packet" class="packet">
      <circle r="11" class="phalo"/>
      <circle r="6" class="pcore"/>
      @if (packetLabel()) { <text y="-16" text-anchor="middle" class="plabel">{{ packetLabel() }}</text> }
    </g>

    <!-- PPCastor (Agent 01): the only drop target for new files -->
    <g id="agent01" class="agent st-{{ agentState() }}" [class.moving]="moving()">
      <circle id="agent-hit" cy="-58" r="64" class="hit"/>
      <foreignObject [attr.x]="bubbleSide() === 'left' ? -330 : -140" [attr.y]="bubbleSide() === 'left' ? -150 : -226" width="280" height="86">
        <div class="bwrap" [class.left]="bubbleSide() === 'left'" xmlns="http://www.w3.org/1999/xhtml">
          <div class="bubble" aria-live="polite"><b>{{ t.control.agent01 }}</b><span>{{ agentMsg() }}</span></div>
        </div>
      </foreignObject>
      <ellipse cy="4" rx="34" ry="7" class="shadow"/>
      <g transform="scale(1.3)">
        <g class="bot">
          <g class="gait">
            <!-- tail, feet -->
            <g class="tail"><ellipse cx="-25" cy="-9" rx="15" ry="8" transform="rotate(-22 -25 -9)" class="fur-dark"/>
              <path d="M-34 -8 l8 -7 M-28 -4 l8 -7 M-22 0 l7 -6" class="tail-line"/></g>
            <ellipse cx="-9" cy="-2" rx="8" ry="4" class="fur-dark foot f1"/><ellipse cx="9" cy="-2" rx="8" ry="4" class="fur-dark foot f2"/>
            <!-- body, belly, high-visibility vest -->
            <ellipse cy="-25" rx="19" ry="22" class="fur"/>
            <ellipse cy="-21" rx="11" ry="14" class="cream"/>
            <path d="M-4 -44 Q-17 -42 -18.5 -26 Q-18.5 -14 -13 -8 H-4 Z" class="vest"/>
            <path d="M4 -44 Q17 -42 18.5 -26 Q18.5 -14 13 -8 H4 Z" class="vest"/>
            <path d="M-18.4 -24 H-4 M4 -24 H18.4" class="vest-stripe"/>
            <!-- arms -->
            <path d="M-16 -36 q-9 6 -7 16" class="arm"/>
            <path d="M16 -36 q10 2 12 -8" class="arm arm-r"/>
            <!-- head -->
            <circle cx="-17" cy="-66" r="4.6" class="fur-dark"/><circle cx="17" cy="-66" r="4.6" class="fur-dark"/>
            <circle cy="-58" r="19" class="fur"/>
            <ellipse cy="-51" rx="11" ry="8" class="cream"/>
            <rect x="-4" y="-49" width="8" height="7.5" rx="1.6" class="teeth"/><path d="M0 -49 V-41.5" class="tooth-line"/>
            <ellipse cy="-55.5" rx="4.2" ry="3" class="nose"/>
            @switch (agentState()) {
              @case ('success') { <path d="M-12 -63 q3.5 -5 7 0 M5 -63 q3.5 -5 7 0" class="eye-l"/> }
              @case ('warning') { <circle cx="-8.5" cy="-64" r="3.6" class="eye-w"/><circle cx="8.5" cy="-64" r="3.6" class="eye-w"/><circle cx="-8.5" cy="-64" r="1.6" class="eye"/><circle cx="8.5" cy="-64" r="1.6" class="eye"/> }
              @case ('error') { <path d="M-12 -67 l6 6 m0 -6 l-6 6 M6 -67 l6 6 m0 -6 l-6 6" class="eye-l"/> }
              @case ('scanning') { <path d="M-12 -63.5 h7 M5 -63.5 h7" class="eye-l"/> }
              @case ('drop') { <circle cx="-8.5" cy="-64" r="3.4" class="eye"/><circle cx="8.5" cy="-64" r="3.4" class="eye"/><circle cx="-7.5" cy="-65" r="1.1" class="glint"/><circle cx="9.5" cy="-65" r="1.1" class="glint"/> }
              @default { <circle cx="-8.5" cy="-64" r="2.6" class="eye blink"/><circle cx="8.5" cy="-64" r="2.6" class="eye blink"/> }
            }
            <!-- hard hat: its stripe shows the state colour -->
            <path d="M-19 -69 Q-19 -90 0 -90 Q19 -90 19 -69 Z" class="hat"/>
            <rect x="-3.2" y="-90" width="6.4" height="21" class="hat-stripe"/>
            <rect x="-23" y="-71" width="46" height="5" rx="2.5" class="hat-brim"/>
            <!-- the file, carried like a log on the shoulder -->
            @if (agentState() === 'carrying' || agentState() === 'walking' || agentState() === 'scanning' || agentState() === 'success') {
              <g class="log" transform="rotate(-10 24 -44)">
                <rect x="6" y="-51" width="42" height="13" rx="6.5" class="log-body"/>
                <path d="M16 -51 v13 M30 -51 v13" class="log-ring"/>
                <ellipse cx="47" cy="-44.5" rx="4" ry="6.5" class="log-end"/><ellipse cx="47" cy="-44.5" rx="1.6" ry="2.8" class="log-core"/>
                <g transform="translate(22 -64)"><path d="M-6 -8 h8 l5 5 v14 h-13 z" class="doc"/><path d="M2 -8 v5 h5" class="fold"/><path d="M-3 1 h7 M-3 5 h7" class="doc-line"/></g>
              </g>
            }
          </g>
        </g>
      </g>
      <text y="26" text-anchor="middle" class="alabel">{{ t.control.agent01 }}</text>
    </g>
  </svg>
</div>
