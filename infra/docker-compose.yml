# FileGrid PPC — infrastructure (Stage 1).
# Included by the root compose.yaml, so run `docker compose <command>` from the
# repository root (the root .env is picked up automatically).
#
# Rules (docs/ARCHITECTURE.md §A.3):
#   - gateway is the ONLY service that publishes ports;
#   - storages (store-db, s3, ftp) live only on the `internal` network;
#   - every secret comes from .env (generated locally by scripts/init-env.sh).
#
# Memory: every service has deploy.resources.limits.memory (architect budget
# for a machine with ~6 GB given to Docker). Check with scripts/mem-report.sh.
#
# Profiles (COMPOSE_PROFILES in .env, default `full`):
#   full - worker-meter, worker-fault, worker-document, worker-video (bulkhead demo)
#   lite - one worker-all consuming every category (low-memory machines)
# Worker services arrive in Stage 2; infrastructure has no profile and always starts.
name: filegrid

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# S3 storage: Silo, the Pigsty community fork of MinIO (see docs/ADR/0001).
# Pinned by release tag AND digest; the same image also ships the `mc` client.
x-silo-image: &silo-image pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329

# Postgres tuning for a small development machine (overridable from the env file).
x-postgres-command: &postgres-command
  - postgres
  - -c
  - shared_buffers=${PG_SHARED_BUFFERS:-64MB}
  - -c
  - max_connections=${PG_MAX_CONNECTIONS:-50}
  - -c
  - work_mem=${PG_WORK_MEM:-4MB}

x-defaults: &defaults
  restart: unless-stopped
  logging: *default-logging

# Backend (Spring Boot): ONE image, used by the api and by every worker.
# Only the api declares `build`: building the same tag from five services at
# once makes the exports collide; the workers reuse the image built for the api.
x-backend: &backend
  restart: unless-stopped
  logging: *default-logging
  image: filegrid/backend:local
  networks: [internal]
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s

x-backend-depends-on: &backend-depends-on
  meta-db:
    condition: service_healthy
  store-db:
    condition: service_healthy
  rabbitmq:
    condition: service_healthy
  ftp:
    condition: service_healthy
  minio-init:
    condition: service_completed_successfully

x-backend-env: &backend-env
  META_DB_URL: jdbc:postgresql://meta-db:5432/filegrid_meta
  META_DB_USER: ${META_DB_USER:?run scripts/init-env.sh first}
  META_DB_PASSWORD: ${META_DB_PASSWORD:?run scripts/init-env.sh first}
  STORE_DB_URL: jdbc:postgresql://store-db:5432/filegrid_store
  STORE_DB_USER: ${STORE_DB_USER:?run scripts/init-env.sh first}
  STORE_DB_PASSWORD: ${STORE_DB_PASSWORD:?run scripts/init-env.sh first}
  S3_ENDPOINT: http://s3:9000
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/init-env.sh first}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/init-env.sh first}
  FTP_HOST: ftp
  FTP_USER: ${FTP_USER:?run scripts/init-env.sh first}
  FTP_PASSWORD: ${FTP_PASSWORD:?run scripts/init-env.sh first}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_USER: ${RABBITMQ_USER:?run scripts/init-env.sh first}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?run scripts/init-env.sh first}
  FILEGRID_POLICY_CHECK_INTERVAL: ${FILEGRID_POLICY_CHECK_INTERVAL:-10s}
  FILEGRID_ROUTING_HEALTH_MAX_AGE: ${FILEGRID_ROUTING_HEALTH_MAX_AGE:-30s}
  FILEGRID_INGESTION_RECOVERY_INTERVAL: ${FILEGRID_INGESTION_RECOVERY_INTERVAL:-30s}
  FILEGRID_UPLOAD_MAX_BYTES: ${FILEGRID_UPLOAD_MAX_BYTES:-5368709120}
  FILEGRID_KEK: ${FILEGRID_KEK:?run scripts/init-env.sh first}
  FILEGRID_KEK_ID: ${FILEGRID_KEK_ID:-kek-1}
  FILEGRID_KEK_PREVIOUS: ${FILEGRID_KEK_PREVIOUS:-}

# JVM memory is set explicitly (heap, direct, metaspace, code cache) instead of
# as a percentage, so every part of the process fits the container limit.
# Limits and options can be overridden from the env file.
#
# Worker defaults: small DB pools (one worker = few concurrent transfers).
x-worker: &worker
  <<: *backend
  pull_policy: never
  deploy:
    resources:
      limits:
        memory: ${WORKER_MEMORY_LIMIT:-448M}
  volumes:
    - staging-data:/data/staging
  depends_on:
    <<: *backend-depends-on
    api:
      condition: service_healthy

x-worker-env: &worker-env
  <<: *backend-env
  SPRING_PROFILES_ACTIVE: worker
  META_DB_POOL_SIZE: "5"
  STORE_DB_POOL_SIZE: "5"
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  WORKER_PREFETCH: ${WORKER_PREFETCH:-1}
  JAVA_TOOL_OPTIONS: "${WORKER_JAVA_OPTS:--Xmx208m -XX:MaxDirectMemorySize=48m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+UseG1GC}"

# Workers that move large videos: bigger limit, at most 2 transfers at a time.
x-worker-large: &worker-large
  <<: *worker
  deploy:
    resources:
      limits:
        memory: ${WORKER_VIDEO_MEMORY_LIMIT:-512M}

x-worker-large-env: &worker-large-env
  <<: *worker-env
  WORKER_CONCURRENCY: ${WORKER_VIDEO_CONCURRENCY:-2}
  JAVA_TOOL_OPTIONS: "${WORKER_VIDEO_JAVA_OPTS:--Xmx224m -XX:MaxDirectMemorySize=96m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+UseG1GC}"

networks:
  edge:
    name: filegrid_edge
  internal:
    name: filegrid_internal
    internal: true
  # Outbound internet for the intelligence service (LLM API); nothing is published on it.
  egress:
    name: filegrid_egress

secrets:
  kc_alertmanager_secret:
    environment: KC_ALERTMANAGER_SECRET

volumes:
  meta-db-data:
  store-db-data:
  s3-data:
  ftp-data:
  ftp-passwd:
  rabbitmq-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:
  alloy-data:
  health-bin:
  staging-data:
  simulator-output:

services:
  # ---------------------------------------------------------------- gateway
  gateway:
    <<: *defaults
    image: traefik:v3.6
    deploy:
      resources:
        limits:
          memory: 96M
    ports:
      - "${GATEWAY_HTTP_PORT:-8080}:80"
      - "${GATEWAY_HTTPS_PORT:-443}:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/certs:ro
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      grafana:
        condition: service_healthy
      api:
        condition: service_healthy

  # ------------------------------------------------------------------- api
  api:
    <<: *backend
    build:
      context: ../backend
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-640M}
    networks: [edge, internal]
    # The directory is mounted (not the single file): editors replace the file
    # on save, and a single-file bind mount would keep pointing at the old one.
    volumes:
      - ../config:/config:ro
      - staging-data:/data/staging
    environment:
      <<: *backend-env
      SPRING_PROFILES_ACTIVE: api
      FILEGRID_POLICY_FILE: /config/policies.yaml
      NOTIFY_ROUTING_FILE: /config/notification-routing.yaml
      NOTIFY_TEMPLATES_DIR: /config/templates
      NOTIFY_MODE: ${NOTIFY_MODE:-SIMULATED}
      NOTIFY_ESCALATION_OVERRIDE: ${NOTIFY_ESCALATION_OVERRIDE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      NOTIFY_CONTACT_DISPATCH: ${NOTIFY_CONTACT_DISPATCH:-}
      NOTIFY_CONTACT_TECH_MANAGER: ${NOTIFY_CONTACT_TECH_MANAGER:-}
      NOTIFY_CONTACT_FIELD_TEAM: ${NOTIFY_CONTACT_FIELD_TEAM:-}
      NOTIFY_CONTACT_IT_SECURITY: ${NOTIFY_CONTACT_IT_SECURITY:-}
      NOTIFY_CONTACT_PLATFORM_ADMIN: ${NOTIFY_CONTACT_PLATFORM_ADMIN:-}
      # PPCastor on real WhatsApp (ADR-0008): the public URL configured in Twilio, and the
      # client-credentials identity used to ask the assistant / transcribe voice notes.
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      KC_WHATSAPP_CLIENT_ID: ${KC_WHATSAPP_CLIENT_ID:-filegrid-whatsapp}
      KC_WHATSAPP_SECRET: ${KC_WHATSAPP_SECRET:?run scripts/init-env.sh first}
      KC_TOKEN_URL: ${KC_TOKEN_URL:-http://keycloak:8080/auth/realms/filegrid/protocol/openid-connect/token}
      INTELLIGENCE_URL: http://intelligence:8000/api/intelligence
      # Stage 11: JWT resource server. Browser tokens carry the public issuer; service
      # tokens fetched over the internal network carry the backchannel one. Both are accepted.
      FILEGRID_OIDC_ISSUER: ${FILEGRID_OIDC_ISSUER:-https://localhost/auth/realms/filegrid}
      FILEGRID_OIDC_INTERNAL_ISSUER: http://keycloak:8080/auth/realms/filegrid
      FILEGRID_OIDC_JWK_SET_URI: http://keycloak:8080/auth/realms/filegrid/protocol/openid-connect/certs
      FILEGRID_LINK_KEY: ${FILEGRID_LINK_KEY:?run scripts/init-env.sh first}
      JAVA_TOOL_OPTIONS: "${API_JAVA_OPTS:--Xmx320m -XX:MaxDirectMemorySize=64m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+UseG1GC}"
    depends_on: *backend-depends-on

  # --------------------------------------------------------------- workers
  # full profile: one worker per category (bulkhead). Scale any of them with
  #   docker compose up -d --scale worker-video=3
  worker-meter:
    <<: *worker
    profiles: [full]
    volumes:
      - staging-data:/data/staging
    environment:
      <<: *worker-env
      WORKER_CATEGORIES: METER_READING

  worker-fault:
    <<: *worker
    profiles: [full]
    volumes:
      - staging-data:/data/staging
    environment:
      <<: *worker-env
      WORKER_CATEGORIES: FAULT_RECORD

  worker-document:
    <<: *worker
    profiles: [full]
    volumes:
      - staging-data:/data/staging
    environment:
      <<: *worker-env
      WORKER_CATEGORIES: CONNECTION_DOCUMENT

  worker-video:
    <<: *worker-large
    profiles: [full]
    volumes:
      - staging-data:/data/staging
    environment:
      <<: *worker-large-env
      WORKER_CATEGORIES: DRONE_VIDEO

  # lite profile: a single worker for every category (low-memory machines).
  # It also moves videos, so it gets the video worker's memory settings.
  worker-all:
    <<: *worker-large
    profiles: [lite]
    volumes:
      - staging-data:/data/staging
    environment:
      <<: *worker-large-env
      WORKER_CATEGORIES: METER_READING,FAULT_RECORD,CONNECTION_DOCUMENT,DRONE_VIDEO

  # --------------------------------------------------------------- simulator
  # Simulated smart meters (dataOrigin=SIMULATED). Normal mode by default;
  # `make sim-peak` / `make sim-normal` / `make sim-storm` recreate it with
  # another mode. It talks to the api inside the internal network.
  # output/ (state.json, injected_anomalies.json) lives in a volume.
  simulator:
    <<: *defaults
    image: filegrid/simulator:local
    build:
      context: ../simulator
      target: runtime
    deploy:
      resources:
        limits:
          memory: ${SIM_MEMORY_LIMIT:-160M}
    networks: [internal]
    environment:
      API_URL: http://api:8080/api
      MODE: ${SIM_MODE:-normal}
      METERS: ${SIM_METERS:-2000}
      INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-60}
      RATE_MULTIPLIER: ${SIM_RATE_MULTIPLIER:-}
      TIME_SCALE: ${SIM_TIME_SCALE:-1}
      DURATION: ${SIM_DURATION:-}
      BATCH_SIZE: ${SIM_BATCH_SIZE:-250}
      CONCURRENCY: ${SIM_CONCURRENCY:-4}
      DUPLICATE_RATE: ${SIM_DUPLICATE_RATE:-0.01}
      SIM_SEED: ${SIM_SEED:-42}
      OUTPUT_DIR: /app/output
      KC_TOKEN_URL: ${KC_TOKEN_URL:-http://keycloak:8080/auth/realms/filegrid/protocol/openid-connect/token}
      KC_SIMULATOR_CLIENT_ID: ${KC_SIMULATOR_CLIENT_ID:-filegrid-simulator}
      KC_SIMULATOR_SECRET: ${KC_SIMULATOR_SECRET:?run scripts/init-env.sh first}
    volumes:
      - simulator-output:/app/output
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ------------------------------------------------- intelligence (Python)
  # Agent 02 (Grid Intelligence), AI Operations Assistant, simulated field voice.
  # Internal only: reached through the gateway at /api/intelligence.
  intelligence:
    <<: *defaults
    image: filegrid/intelligence:local
    build:
      context: ../intelligence
      target: runtime
    deploy:
      resources:
        limits:
          memory: ${INTELLIGENCE_MEMORY_LIMIT:-384M}
    # egress: outbound HTTPS to the LLM provider only (no published port).
    networks: [internal, egress]
    environment:
      META_DB_HOST: meta-db
      META_DB_USER: ${META_DB_USER:?run scripts/init-env.sh first}
      META_DB_PASSWORD: ${META_DB_PASSWORD:?run scripts/init-env.sh first}
      STORE_DB_HOST: store-db
      STORE_DB_USER: ${STORE_DB_USER:?run scripts/init-env.sh first}
      STORE_DB_PASSWORD: ${STORE_DB_PASSWORD:?run scripts/init-env.sh first}
      FILEGRID_API_URL: http://api:8080/api
      TOPOLOGY_PATH: /app/topology.yaml
      GROUND_TRUTH_PATH: /simulator-output/injected_anomalies.json
      DOCS_DIRS: /app/docs:/app/config
      INTELLIGENCE_ANALYSIS_INTERVAL_SECONDS: ${INTELLIGENCE_ANALYSIS_INTERVAL_SECONDS:-60}
      INTELLIGENCE_WINDOW_HOURS: ${INTELLIGENCE_WINDOW_HOURS:-24}
      INTELLIGENCE_INCIDENT_MIN_CONFIDENCE: ${INTELLIGENCE_INCIDENT_MIN_CONFIDENCE:-0.8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-claude-sonnet-5-5}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-simulated}
      # WhatsApp voice notes are transcribed with Gemini (empty = LLM_MODEL).
      VOICE_TRANSCRIBE_MODEL: ${VOICE_TRANSCRIBE_MODEL:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      KC_TOKEN_URL: ${KC_TOKEN_URL:-http://keycloak:8080/auth/realms/filegrid/protocol/openid-connect/token}
      KC_INTELLIGENCE_CLIENT_ID: ${KC_INTELLIGENCE_CLIENT_ID:-filegrid-intelligence}
      KC_INTELLIGENCE_SECRET: ${KC_INTELLIGENCE_SECRET:?run scripts/init-env.sh first}
    volumes:
      - ../simulator/topology.yaml:/app/topology.yaml:ro
      - simulator-output:/simulator-output:ro
      - ../docs:/app/docs:ro
      - ../config:/app/config:ro
    depends_on:
      api:
        condition: service_healthy
      meta-db:
        condition: service_healthy
      store-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  # ------------------------------------------------------------ metadata DB
  meta-db:
    <<: *defaults
    image: pgvector/pgvector:pg16
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    # More connections than store-db: Keycloak keeps its own pool in this instance.
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-64MB}
      - -c
      - max_connections=${META_DB_MAX_CONNECTIONS:-80}
      - -c
      - work_mem=${PG_WORK_MEM:-4MB}
    environment:
      POSTGRES_DB: filegrid_meta
      POSTGRES_USER: ${META_DB_USER:?run scripts/init-env.sh first}
      POSTGRES_PASSWORD: ${META_DB_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - meta-db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------- Keycloak
  # One-shot, idempotent: role + database `keycloak` inside meta-db.
  keycloak-db-init:
    image: pgvector/pgvector:pg16
    deploy:
      resources:
        limits:
          memory: 64M
    restart: "no"
    logging: *default-logging
    entrypoint: ["/bin/sh", "/init/init-db.sh"]
    environment:
      META_DB_USER: ${META_DB_USER:?run scripts/init-env.sh first}
      META_DB_PASSWORD: ${META_DB_PASSWORD:?run scripts/init-env.sh first}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - ./keycloak/init-db.sh:/init/init-db.sh:ro
    networks: [internal]
    depends_on:
      meta-db:
        condition: service_healthy

  # Identity provider (OIDC). Public only through the gateway under /auth/realms and
  # /auth/resources; the admin console is not routed. The realm (clients, roles, demo
  # users) is imported from infra/keycloak/realm-filegrid.json on the first start;
  # secrets are ${ENV} placeholders resolved by Keycloak at import time.
  # ---------------------------------------------------------------- tunnel
  # Optional (profile "tunnel"): a Cloudflare quick tunnel with a temporary public https URL, so Twilio
  # can deliver WhatsApp messages to PPCastor (ADR-0008). It reaches ONLY the gateway's internal
  # "whatsapp" entry point, whose single route is POST /api/whatsapp/inbound. Start it with
  #   docker compose --profile tunnel up -d tunnel && docker compose logs tunnel | grep trycloudflare
  # then set WHATSAPP_WEBHOOK_URL=<url>/api/whatsapp/inbound and the same URL in the Twilio sandbox.
  tunnel:
    image: cloudflare/cloudflared:2025.4.0
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://gateway:8088"]
    networks: [edge]
    depends_on: [gateway]

  keycloak:
    <<: *defaults
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start", "--import-realm"]
    deploy:
      resources:
        limits:
          memory: ${KC_MEMORY_LIMIT:-768M}
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://meta-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?run scripts/init-env.sh first}
      KC_DB_POOL_INITIAL_SIZE: "2"
      KC_DB_POOL_MAX_SIZE: "10"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${KC_PUBLIC_URL:-https://localhost/auth}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?run scripts/init-env.sh first}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?run scripts/init-env.sh first}
      JAVA_OPTS_KC_HEAP: -XX:MaxRAMPercentage=60
      # Read by the realm import (placeholders in realm-filegrid.json).
      KC_SIMULATOR_SECRET: ${KC_SIMULATOR_SECRET:?run scripts/init-env.sh first}
      KC_ALERTMANAGER_SECRET: ${KC_ALERTMANAGER_SECRET:?run scripts/init-env.sh first}
      KC_INTELLIGENCE_SECRET: ${KC_INTELLIGENCE_SECRET:?run scripts/init-env.sh first}
      KC_WHATSAPP_SECRET: ${KC_WHATSAPP_SECRET:?run scripts/init-env.sh first}
      KC_DEMO_FIELD_PASSWORD: ${KC_DEMO_FIELD_PASSWORD:?run scripts/init-env.sh first}
      KC_DEMO_DISPATCHER_PASSWORD: ${KC_DEMO_DISPATCHER_PASSWORD:?run scripts/init-env.sh first}
      KC_DEMO_CONNECTIONS_PASSWORD: ${KC_DEMO_CONNECTIONS_PASSWORD:?run scripts/init-env.sh first}
      KC_DEMO_ANALYST_PASSWORD: ${KC_DEMO_ANALYST_PASSWORD:?run scripts/init-env.sh first}
      KC_DEMO_INCIDENT_MANAGER_PASSWORD: ${KC_DEMO_INCIDENT_MANAGER_PASSWORD:?run scripts/init-env.sh first}
      KC_DEMO_ADMIN_PASSWORD: ${KC_DEMO_ADMIN_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - ./keycloak/realm-filegrid.json:/opt/keycloak/data/import/realm-filegrid.json:ro
    networks: [internal]
    healthcheck:
      # No curl in the image: raw HTTP over bash /dev/tcp to the management port.
      test: ["CMD-SHELL", "bash -c '{ printf \"HEAD /auth/health/ready HTTP/1.0\\r\\n\\r\\n\" >&0; grep -q \"HTTP/1.0 200\"; } 0<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully

  # ------------------------------------------- storage "Database" (separate)
  store-db:
    <<: *defaults
    image: postgres:16-alpine
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M
    command: *postgres-command
    environment:
      POSTGRES_DB: filegrid_store
      POSTGRES_USER: ${STORE_DB_USER:?run scripts/init-env.sh first}
      POSTGRES_PASSWORD: ${STORE_DB_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - store-db-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ------------------------- storage "S3" (MinIO-compatible: Silo, ADR-0001)
  s3:
    <<: *defaults
    image: *silo-image
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run scripts/init-env.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/init-env.sh first}
      # Metrics are reachable only on the internal network.
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - s3-data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-shot: buckets (versioned) + dedicated FileGrid service user (not root).
  minio-init:
    image: *silo-image
    deploy:
      resources:
        limits:
          memory: 96M
    restart: "no"
    logging: *default-logging
    entrypoint: ["/bin/sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?run scripts/init-env.sh first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run scripts/init-env.sh first}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run scripts/init-env.sh first}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?run scripts/init-env.sh first}
    volumes:
      - ./minio:/init:ro
    networks: [internal]
    depends_on:
      s3:
        condition: service_healthy

  # ------------------------------------------------------- storage "FTP"
  ftp:
    <<: *defaults
    image: stilliard/pure-ftpd:latest
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      # Passive mode: the server advertises its docker-network hostname, so
      # clients inside `internal` connect back to ftp:30000-30099.
      PUBLICHOST: ftp
      FTP_PASSIVE_PORTS: "30000:30099"
      FTP_MAX_CLIENTS: "50"
      FTP_MAX_CONNECTIONS: "50"
      FTP_USER_NAME: ${FTP_USER:?run scripts/init-env.sh first}
      FTP_USER_PASS: ${FTP_PASSWORD:?run scripts/init-env.sh first}
      FTP_USER_HOME: /home/ftpusers/filegrid
    volumes:
      - ftp-data:/home/ftpusers
      - ftp-passwd:/etc/pure-ftpd/passwd
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/21 && head -c 3 <&3 | grep -q 220'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ------------------------------------------------------------- RabbitMQ
  rabbitmq:
    <<: *defaults
    image: rabbitmq:4.1-management-alpine
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?run scripts/init-env.sh first}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?run scripts/init-env.sh first}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/20-filegrid.conf:/etc/rabbitmq/conf.d/20-filegrid.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # -------------------------------------------------------- observability
  # Loki and Tempo ship minimal images without a shell or HTTP client, so a
  # healthcheck cannot run inside them. This one-shot copies a static busybox
  # binary into a volume that they mount read-only (used only as `busybox wget`).
  health-tools:
    image: busybox:1.37-musl
    deploy:
      resources:
        limits:
          memory: 16M
    restart: "no"
    logging: *default-logging
    network_mode: none
    command: ["cp", "/bin/busybox", "/health/busybox"]
    volumes:
      - health-bin:/health

  prometheus:
    <<: *defaults
    image: prom/prometheus:v3.5.0
    deploy:
      resources:
        limits:
          memory: 320M
        reservations:
          memory: 128M
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=3d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      alertmanager:
        condition: service_healthy

  alertmanager:
    <<: *defaults
    image: prom/alertmanager:v0.28.1
    deploy:
      resources:
        limits:
          memory: 48M
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    # client_credentials secret for the webhook to the api (Stage 11), read from a file.
    secrets:
      - source: kc_alertmanager_secret
        target: kc_alertmanager_secret
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  loki:
    <<: *defaults
    image: grafana/loki:3.5.5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
      - health-bin:/health:ro
    networks: [internal]
    depends_on:
      health-tools:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/health/busybox", "wget", "-q", "--spider", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  tempo:
    <<: *defaults
    image: grafana/tempo:2.8.2
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 96M
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
      - health-bin:/health:ro
    networks: [internal]
    depends_on:
      health-tools:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/health/busybox", "wget", "-q", "--spider", "http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  alloy:
    <<: *defaults
    image: grafana/alloy:v1.11.0
    deploy:
      resources:
        limits:
          memory: 160M
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read-only access to discover containers and tail their logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/12345 && printf \"GET /-/ready HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  grafana:
    <<: *defaults
    image: grafana/grafana:12.2.0
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          memory: 96M
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?run scripts/init-env.sh first}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run scripts/init-env.sh first}
      GF_SERVER_ROOT_URL: https://localhost/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      tempo:
        condition: service_healthy

  # ------------------------------------------------------------ toxiproxy
  # Only started here; proxies are defined in Stage 18.
  toxiproxy:
    <<: *defaults
    image: ghcr.io/shopify/toxiproxy:2.12.0
    deploy:
      resources:
        limits:
          memory: 48M
    command: ["-host=0.0.0.0"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "/toxiproxy-cli", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  # -------------------------------------------------------------- frontend
  # Angular SPA served by nginx (non-root, :8080). Only the gateway reaches it.
  frontend:
    <<: *defaults
    build:
      context: ../frontend
    image: filegrid/frontend:local
    deploy:
      resources:
        limits:
          memory: 64M
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    depends_on:
      api:
        condition: service_healthy
