apiVersion: 1

# `$$` escapes `$` (otherwise Grafana interpolates it as an environment variable).
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  # Stage 8: the backend logs JSON with "traceId"; the derived field opens the trace in Tempo.
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: traceId
          datasourceUid: tempo
          matcherRegex: '"traceId"\s*:\s*"(\w+)"'
          url: '$${__value.raw}'
          urlDisplayLabel: 'Deschide trace-ul în Tempo'

  # Stage 8: from a span to the logs of the same trace (Loki), and to the metrics.
  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{job="docker"} |= "$${__trace.traceId}"'
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
