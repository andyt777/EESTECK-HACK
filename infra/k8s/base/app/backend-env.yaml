# Non-secret settings shared by the api and every worker (the `x-backend-env`
# block of infra/docker-compose.yml, with its defaults). Secrets (DB/S3/FTP/
# RabbitMQ credentials, KEK) come from the `backend-secrets` Secret generated by
# scripts/k8s/generate.sh from .env.
#
# RABBITMQ_PORT / FTP_PORT are set explicitly AND every pod has
# enableServiceLinks: false: otherwise Kubernetes injects RABBITMQ_PORT=tcp://...
# and FTP_PORT=tcp://... for the Services of the same name, and Spring would read
# them as the port numbers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-env
  labels:
    app.kubernetes.io/part-of: filegrid
data:
  META_DB_URL: jdbc:postgresql://meta-db:5432/filegrid_meta
  STORE_DB_URL: jdbc:postgresql://store-db:5432/filegrid_store
  S3_ENDPOINT: http://s3:9000
  FTP_HOST: ftp
  FTP_PORT: "21"
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  FILEGRID_STAGING_DIR: /data/staging
  FILEGRID_POLICY_CHECK_INTERVAL: 10s
  FILEGRID_ROUTING_HEALTH_MAX_AGE: 30s
  FILEGRID_INGESTION_RECOVERY_INTERVAL: 30s
  FILEGRID_UPLOAD_MAX_BYTES: "5368709120"
