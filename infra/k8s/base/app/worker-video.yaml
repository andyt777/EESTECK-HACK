# worker-video: same image as the api, profile `worker`, consumes ONLY
# filegrid.jobs.video (WORKER_CATEGORIES=DRONE_VIDEO) - one pool per category
# (bulkhead). Large videos: bigger limit, at most 2 transfers at a time.
#
# No `replicas` field: KEDA (autoscaling/scaledobjects.yaml) owns it through the
# HPA it creates, scaling on the depth of filegrid.jobs.video.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-video
  labels:
    app.kubernetes.io/name: worker-video
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: filegrid
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-video
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker-video
        app.kubernetes.io/component: worker
        app.kubernetes.io/part-of: filegrid
        filegrid.io/backend: "true"
    spec:
      # Time to finish a transfer; an unacknowledged job is redelivered anyway.
      terminationGracePeriodSeconds: 60
      enableServiceLinks: false
      # Same as `depends_on: api: service_healthy` in compose: the api runs the
      # Flyway migrations, so a worker starts only once the api reports UP.
      initContainers:
        - name: wait-for-api
          image: busybox:1.37-musl
          command: ["sh", "-c", "until wget -q -T 3 -O - http://api:8081/actuator/health | grep -q UP; do echo waiting for api; sleep 3; done"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 10m, memory: 8Mi}
            limits: {memory: 16Mi}
      containers:
        - name: worker
          image: filegrid/backend:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-env
            - secretRef:
                name: backend-secrets
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: worker
            - name: WORKER_CATEGORIES
              value: DRONE_VIDEO
            - name: META_DB_POOL_SIZE
              value: "5"
            - name: STORE_DB_POOL_SIZE
              value: "5"
            - name: WORKER_CONCURRENCY
              value: "2"
            - name: WORKER_PREFETCH
              value: "1"
            - name: JAVA_TOOL_OPTIONS
              value: "-Xmx224m -XX:MaxDirectMemorySize=96m -XX:MaxMetaspaceSize=128m -XX:ReservedCodeCacheSize=64m -Xss512k -XX:+UseG1GC"
          ports:
            - name: management
              containerPort: 8081
          startupProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /actuator/health, port: management}
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: staging
              mountPath: /data/staging
      volumes:
        - name: staging
          persistentVolumeClaim:
            claimName: staging-data
