# KEDA (pinned v2.21.0, installed by scripts/k8s/up.sh): one ScaledObject per
# worker category, each watching ONLY its own queue filegrid.jobs.<category>
# (rabbitmq scaler, docs: https://keda.sh/docs/2.21/scalers/rabbitmq-queue/).
# A storm of fault records therefore fills only filegrid.jobs.fault and scales
# only worker-fault: the bulkhead is visible in `kubectl get pods -w`.
#
# Connection string (amqp://user:pass@rabbitmq.filegrid.svc.cluster.local:5672/)
# is in the `keda-rabbitmq` Secret generated by scripts/k8s/generate.sh; the
# trailing slash selects the default vhost.
#
# mode QueueLength over AMQP counts READY messages (prefetch is 1, so a busy
# worker holds at most WORKER_CONCURRENCY unacked jobs). `value` is the target
# number of ready messages per replica.
#
# minReplicaCount 1: every category always has a consumer (no cold start for
# the first file). pollingInterval / cooldownPeriod are short for the demo.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: rabbitmq-auth
spec:
  secretTargetRef:
    - parameter: host
      name: keda-rabbitmq
      key: host
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-fault
spec:
  scaleTargetRef:
    name: worker-fault
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: filegrid.jobs.fault
        mode: QueueLength
        value: "5"
      authenticationRef:
        name: rabbitmq-auth
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-meter
spec:
  scaleTargetRef:
    name: worker-meter
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: filegrid.jobs.meter
        mode: QueueLength
        # Meter batches arrive steadily; scale only on a real backlog.
        value: "50"
      authenticationRef:
        name: rabbitmq-auth
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-document
spec:
  scaleTargetRef:
    name: worker-document
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: filegrid.jobs.document
        mode: QueueLength
        value: "5"
      authenticationRef:
        name: rabbitmq-auth
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-video
spec:
  scaleTargetRef:
    name: worker-video
  minReplicaCount: 1
  maxReplicaCount: 2
  pollingInterval: 5
  cooldownPeriod: 120
  triggers:
    - type: rabbitmq
      metadata:
        protocol: amqp
        queueName: filegrid.jobs.video
        mode: QueueLength
        # Each video takes minutes; one waiting video is already a backlog.
        value: "2"
      authenticationRef:
        name: rabbitmq-auth
