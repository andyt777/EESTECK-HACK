# s3: MinIO-compatible storage - Silo, the Pigsty community fork of MinIO
# (docs/ADR/0001). Same image, pinned by tag AND digest, as docker-compose.
# s3-init is the one-shot bootstrap (versioned buckets + least-privilege service
# user); it runs infra/minio/init.sh, shipped as the `s3-init` ConfigMap that
# scripts/k8s/generate.sh builds from infra/minio/ (single source of truth).
apiVersion: v1
kind: Service
metadata:
  name: s3
  labels:
    app.kubernetes.io/name: s3
    app.kubernetes.io/part-of: filegrid
    filegrid.io/storage: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: s3
  ports:
    - name: s3
      port: 9000
      targetPort: s3
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  labels:
    app.kubernetes.io/name: s3
    app.kubernetes.io/part-of: filegrid
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3
        app.kubernetes.io/part-of: filegrid
        filegrid.io/storage: "true"
    spec:
      enableServiceLinks: false
      containers:
        - name: s3
          image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: s3-secret, key: MINIO_ROOT_USER}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: s3-secret, key: MINIO_ROOT_PASSWORD}
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: public
          ports:
            - name: s3
              containerPort: 9000
          readinessProbe:
            exec:
              command: ["mc", "ready", "local"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mc", "ready", "local"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 384Mi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# Idempotent (init.sh uses --ignore-existing), so re-running it is safe.
# Until s3 is ready, `mc alias set` fails and the Job retries (backoffLimit).
apiVersion: batch/v1
kind: Job
metadata:
  name: s3-init
  labels:
    app.kubernetes.io/name: s3-init
    app.kubernetes.io/part-of: filegrid
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-init
        app.kubernetes.io/part-of: filegrid
        filegrid.io/s3-init: "true"
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: init
          image: pgsty/silo:RELEASE.2026-11-12T00-00-00Z@sha256:c20d112390b9a9ce8c11b8af95ad35bcaa62f4759663c09c936cd8d2b511f329
          command: ["/bin/sh", "/init/init.sh"]
          envFrom:
            - secretRef:
                name: s3-secret
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 96Mi}
          volumeMounts:
            - name: init
              mountPath: /init
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: s3-init
