# store-db: the "Database" storage (separate PostgreSQL 16 instance).
# Reachable only from api, workers and intelligence (see network-policies.yaml).
apiVersion: v1
kind: Service
metadata:
  name: store-db
  labels:
    app.kubernetes.io/name: store-db
    app.kubernetes.io/part-of: filegrid
    filegrid.io/storage: "true"
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: store-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: store-db
  labels:
    app.kubernetes.io/name: store-db
    app.kubernetes.io/part-of: filegrid
spec:
  serviceName: store-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: store-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: store-db
        app.kubernetes.io/part-of: filegrid
        filegrid.io/storage: "true"
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          args:
            - -c
            - shared_buffers=64MB
            - -c
            - max_connections=80
            - -c
            - work_mem=4MB
          env:
            - name: POSTGRES_DB
              value: filegrid_store
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: store-db-secret, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: store-db-secret, key: POSTGRES_PASSWORD}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 96Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
