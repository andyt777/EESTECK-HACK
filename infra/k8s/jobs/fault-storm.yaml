# Fault-record storm (`make k8s-storm`, scripts/k8s/storm.sh). NOT part of the
# kustomization: it runs only on demand.
#
# Each pod uploads FILES_PER_POD small fault records through the real upload
# path (POST /api/files, multipart, category=FAULT_RECORD, dataOrigin=SIMULATED).
# The api stages them and publishes one job per file to filegrid.jobs.fault, so
# the queue grows faster than one worker-fault drains it and KEDA adds
# worker-fault replicas. No other queue receives anything.
#
# It reuses the backend image (it already ships bash + curl), so no extra image
# has to be pulled or pinned.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fault-storm-script
  namespace: filegrid
  labels:
    app.kubernetes.io/name: fault-storm
    app.kubernetes.io/part-of: filegrid
data:
  storm.sh: |
    #!/usr/bin/env bash
    # Uploads FILES_PER_POD random fault records of SIZE_KB each.
    set -u
    ok=0
    failed=0
    for i in $(seq 1 "$FILES_PER_POD"); do
      file="/tmp/fault-${HOSTNAME}-${i}.rec"
      head -c "$((SIZE_KB * 1024))" /dev/urandom > "$file"
      code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
        -F "file=@${file};type=application/octet-stream" \
        -F "category=FAULT_RECORD" \
        -F "zone=storm-demo" \
        -F "station=ST-$((i % 10))" \
        -F "eventType=STORM_TEST" \
        -F "dataOrigin=SIMULATED" \
        -F "idempotencyKey=storm-${HOSTNAME}-${i}" \
        "${API_URL}/files")
      rm -f "$file"
      if [ "$code" = "201" ] || [ "$code" = "200" ]; then
        ok=$((ok + 1))
      else
        failed=$((failed + 1))
      fi
    done
    echo "fault-storm: pod=${HOSTNAME} uploaded=${ok} failed=${failed}"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: fault-storm
  namespace: filegrid
  labels:
    app.kubernetes.io/name: fault-storm
    app.kubernetes.io/part-of: filegrid
spec:
  parallelism: 6
  completions: 6
  backoffLimit: 0
  ttlSecondsAfterFinished: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fault-storm
        app.kubernetes.io/part-of: filegrid
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: storm
          image: filegrid/backend:local
          imagePullPolicy: Never
          command: ["bash", "/scripts/storm.sh"]
          env:
            - name: API_URL
              value: http://api:8080/api
            - name: FILES_PER_POD
              value: "150"
            - name: SIZE_KB
              value: "256"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: fault-storm-script
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
