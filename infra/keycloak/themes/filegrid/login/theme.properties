# FileGrid login theme: the Keycloak 26 default (keycloak.v2, PatternFly 5) with the app's look.
# Only styles and images are added; the FTL templates stay the upstream ones, so upgrades keep working.
parent=keycloak.v2
import=common/keycloak
# css/styles.css is resolved from the parent theme; filegrid.css comes last and wins.
styles=css/styles.css css/filegrid.css
# The app is light (baby blue + white); never switch the login page to dark with the OS.
darkMode=false
