global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8083"]
  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
  - job_name: s3
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["s3:9000"]
  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets: ["grafana:3000"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Backend (api + workers). Docker DNS returns one address per replica, so
  # scaled workers are discovered without editing this file; services that are
  # not running (other compose profile) simply resolve to nothing.
  - job_name: backend
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [api, worker-meter, worker-fault, worker-document, worker-video, worker-all]
        type: A
        port: 8081
        refresh_interval: 15s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
  - job_name: simulator
    static_configs:
      - targets: ["simulator:9105"]
  # The intelligence target is added in Stage 15.
