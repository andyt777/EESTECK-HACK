# Routes. `/` goes to the frontend (lowest priority).
http:
  routers:
    grafana:
      rule: "PathPrefix(`/grafana`)"
      entryPoints: [websecure]
      service: grafana

    # The application API (the backend serves everything under /api).
    api:
      rule: "PathPrefix(`/api`)"
      entryPoints: [websecure]
      service: api

    # The ONLY actuator path reachable from outside. Actuator runs on a
    # separate management port (8081) that no other route points to, so
    # /actuator/prometheus and the rest stay internal.
    api-health:
      rule: "Path(`/api/actuator/health`)"
      entryPoints: [websecure]
      service: api-management
      middlewares: [api-health-path]
      priority: 1000

    # Intelligence service (Agent 02, AI Operations Assistant, field voice).
    # Higher priority than the generic /api router.
    intelligence:
      rule: "PathPrefix(`/api/intelligence`)"
      entryPoints: [websecure]
      service: intelligence
      priority: 500

    # Keycloak (Stage 11): only the realm endpoints and static resources.
    # The admin console (/auth/admin) is deliberately NOT routed.
    auth:
      rule: "PathPrefix(`/auth/realms`) || PathPrefix(`/auth/resources`)"
      entryPoints: [websecure]
      service: keycloak
      priority: 600

    # Token endpoint and login form submissions: rate limited (brute force).
    auth-sensitive:
      rule: "PathRegexp(`^/auth/realms/[^/]+/(protocol/openid-connect/token|login-actions/)`)"
      entryPoints: [websecure]
      service: keycloak
      middlewares: [auth-ratelimit]
      priority: 700

    # Frontend (Angular SPA). Lowest priority: /api and /grafana always win.
    frontend:
      rule: "PathPrefix(`/`)"
      entryPoints: [websecure]
      service: frontend
      priority: 1

  middlewares:
    api-health-path:
      replacePath:
        path: /actuator/health
    auth-ratelimit:
      rateLimit:
        average: 10
        period: 1s
        burst: 30

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
    api:
      loadBalancer:
        servers:
          - url: "http://api:8080"
    api-management:
      loadBalancer:
        servers:
          - url: "http://api:8081"
    intelligence:
      loadBalancer:
        servers:
          - url: "http://intelligence:8000"
    frontend:
      loadBalancer:
        servers:
          - url: "http://frontend:8080"
    keycloak:
      loadBalancer:
        servers:
          - url: "http://keycloak:8080"
