# Traefik static configuration.
# File provider only: no Docker socket is mounted into the public-facing gateway.
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # Traefik v3 cuts any request body still being read after 60 s by default:
    # a large video sent in one tus PATCH over a slow link takes much longer.
    # writeTimeout stays 0 (no limit) for the SSE stream.
    transport:
      respondingTimeouts:
        readTimeout: 1h
        writeTimeout: 0s
        idleTimeout: 180s
    http:
      tls: {}
      middlewares:
        - security-headers@file
  # Internal only (not published): health and metrics.
  ping:
    address: ":8082"
  metrics:
    address: ":8083"

ping:
  entryPoint: ping

metrics:
  prometheus:
    entryPoint: metrics
    addRoutersLabels: true

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO
accessLog: {}

global:
  checkNewVersion: false
  sendAnonymousUsage: false
