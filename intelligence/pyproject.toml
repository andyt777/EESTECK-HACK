[project]
name = "filegrid-intelligence"
version = "0.1.0"
description = "FileGrid PPC - Agent 02 (Grid Intelligence), AI Operations Assistant, simulated field voice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.2",
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    "pandas==2.2.3",
    "numpy==2.2.5",
    "psycopg[binary]==3.2.9",
    "psycopg-pool==3.2.6",
    "prometheus-client==0.21.1",
    "anthropic>=0.75",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "ruff==0.11.8",
]

[project.scripts]
filegrid-intelligence = "filegrid_intelligence.main:run"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filegrid_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
