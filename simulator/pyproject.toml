[project]
name = "filegrid-simulator"
version = "0.1.0"
description = "FileGrid PPC - simulated smart meters sending readings to FileGrid"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx==0.28.1",
    "pyyaml==6.0.2",
    "prometheus-client==0.21.1",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.26.0",
    "ruff==0.11.8",
]

[project.scripts]
filegrid-simulator = "filegrid_simulator.main:run"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filegrid_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
